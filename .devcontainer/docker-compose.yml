version: "3"
services:
  db:
    build:
      context: ../docker/postgres
    environment:
      - POSTGRES_DB=dejavu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    networks:
      - db_network
    # Keep database running for development
    restart: unless-stopped

  python:
    build:
      context: ../docker/python
    volumes:
      # Mount workspace for VS Code development
      - ..:/workspace:cached
    depends_on:
      - db
    networks:
      - db_network
    # Overrides default command so container doesn't shut down
    command: /bin/sh -c "while sleep 1000; do :; done"
    # Uncomment to enable Docker from inside the container
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

    # Uncomment for ptrace-based debuggers like C++, Go, and Rust
    # cap_add:
    #   - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

networks:
  db_network:
